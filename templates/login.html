<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Sign in | Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="login-title">
            <a class="app-brand" href="{{ url_for('login') }}">
                <span class="app-brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M4 18.5V12m5 6.5V5.5m5 13V9m5 9.5V3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                </span>
                Expense Tracker
            </a>
            <p class="eyebrow" style="margin-top: 30px !important;">Welcome back</p>
            <h1 id="login-title">Sign in to your account</h1>
            <p class="auth-subtitle">Pick up where your household left off and keep your finances on track.</p>
            <form method="POST">
                <div>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="Your username">
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Your password">
                </div>
                <button type="submit">Sign in</button>
            </form>
            <p class="auth-footer">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
        </section>
    </main>
</body>
</html>
