<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Edit transaction | Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .edit-panel {
            max-width: 720px;
            margin: 0 auto;
        }

        .edit-form {
            padding: 22px;
        }

        @media (max-width: 560px) {
            .edit-form {
                padding: 17px;
            }
        }
    </style>
</head>
<body>
    <nav class="app-nav" aria-label="Main navigation">
        <a class="app-brand" href="/">
            <span class="app-brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 18.5V12m5 6.5V5.5m5 13V9m5 9.5V3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            </span>
            Expense Tracker
        </a>
        <div class="app-links">
            <a href="/">Home</a>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('transactions') }}" aria-current="page">Transactions</a>
            <a href="{{ url_for('budgets') }}">Budgets</a>
            <a href="{{ url_for('manage_family') }}">Family</a>
            <a class="logout-link" href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <main class="container">
        <header class="page-intro">
            <div>
                <p class="eyebrow">Keep your records accurate</p>
                <h1>Edit transaction</h1>
                <p>Update the transaction details below. Your changes will be reflected in your totals.</p>
            </div>
        </header>
        <section class="panel edit-panel" aria-label="Edit transaction form">
            <div class="panel-heading">
                <div>
                    <h2>Transaction details</h2>
                    <p>Review your changes before saving.</p>
                </div>
            </div>
            <form method="POST" class="edit-form">
                <div class="form-grid">
                    <div>
                        <label for="category">Category</label>
                        <input type="text" id="category" name="category" value="{{ transaction.category }}" required>
                    </div>
                    <div>
                        <label for="type">Type</label>
                        <select id="type" name="type" required>
                            <option value="income" {% if transaction.transaction_type|lower == 'income' %}selected{% endif %}>Income</option>
                            <option value="expense" {% if transaction.transaction_type|lower == 'expense' %}selected{% endif %}>Expense</option>
                        </select>
                    </div>
                    <div>
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" name="amount" value="{{ transaction.amount }}" required inputmode="decimal">
                    </div>
                    <div>
                        <label for="transaction_date">Date</label>
                        <input type="date" id="transaction_date" name="transaction_date" value="{{ transaction.transaction_date }}" required>
                    </div>
                    <div class="form-wide">
                        <label for="description">Description</label>
                        <input type="text" id="description" name="description" value="{{ transaction.description or '' }}" placeholder="Add a note (optional)">
                    </div>
                    <div class="form-wide form-actions">
                        <button type="submit">Save changes</button>
                        <a class="button button-secondary" href="{{ url_for('transactions') }}">Cancel</a>
                    </div>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
